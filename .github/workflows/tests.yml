name: tests
on:
  push:
  pull_request:

env:
  # deterministic offline backends: same result on every machine
  FINRESEARCH_EMBEDDER: tfidf
  FINRESEARCH_SCORER: lexicon
  FINRESEARCH_OFFLINE: "1"
  FINRESEARCH_LLM: none

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install (core + api + test tools; no PyTorch)
        run: pip install -e ".[api,llm,dev]"
      - name: lint
        run: ruff check .
      - name: tests with coverage floor
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70
      - name: benchmark must not regress
        run: |
          python -m eval.run_all --offline --out ci_metrics.json
          python - <<'PY'
          import json
          m = json.load(open("results/ci_metrics.json"))
          h = m["hallucination"]
          assert h["catch_rate_recall"] >= 0.95, h["catch_rate_recall"]
          assert h["false_positive_rate"] <= 0.02, h["false_positive_rate"]
          assert m["grounding"]["grounding_rate"] >= 0.99, m["grounding"]["grounding_rate"]
          assert m["router_heldout"]["exact_match_accuracy"] >= 0.80, m["router_heldout"]
          print("ok", h["catch_rate_recall"], h["false_positive_rate"])
          PY

  audit:
    runs-on: ubuntu-latest
    # advisory: a new CVE in a transitive dependency should be visible, not block a merge
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pip-audit && pip install -e ".[api,llm,ui]"
      - run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: finresearch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: container starts and answers /health
        run: |
          docker run -d --name fr -p 8000:8000 -e FINRESEARCH_OFFLINE=1 -e FINRESEARCH_LLM=none finresearch:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs fr
          exit 1

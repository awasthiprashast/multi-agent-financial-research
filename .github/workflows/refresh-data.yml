name: refresh-cache
on:
  schedule: [{cron: "30 1 * * 1-5"}]   # 07:00 IST weekdays
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - name: fetch prices for every supported company
        run: |
          python - <<'PY'
          from data.universe import COMPANIES
          from data.connectors.live import fetch_prices
          missing = [c.ticker for c in COMPANIES if not fetch_prices(c.ticker)]
          assert not missing, f"no prices for {missing}"
          PY

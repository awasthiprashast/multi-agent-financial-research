[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finresearch-assistant"
version = "1.0.0"
description = "Multi-agent financial research assistant that verifies every claim against source data before showing it"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "chromadb>=0.5,<2",
    "requests>=2.31,<3",
    "yfinance>=0.2.40,<2",
    "feedparser>=6,<7",
]

[project.optional-dependencies]
# FinBERT sentiment + sentence-transformer embeddings (large: pulls in PyTorch).
# Without it the system falls back to the lexicon scorer and TF-IDF embeddings.
neural = ["sentence-transformers>=3,<7", "transformers>=4.40,<6", "torch>=2.2,<3"]
# Hosted LLM analysts (Groq). Local Ollama needs no extra package.
llm = ["groq>=0.9,<2"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]
ui = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5", "httpx>=0.27,<1", "ruff>=0.5", "pip-audit>=2.7"]
docs = ["matplotlib>=3.8,<4"]
all = ["finresearch-assistant[neural,llm,api,ui]"]

[tool.setuptools]
py-modules = ["core", "llm", "pipeline", "config", "sentiment_model", "logging_setup"]

[tool.setuptools.packages.find]
include = ["agents*", "rag*", "data*", "eval*", "api*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*_backup_*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",   # long lines: wrapped by hand where it reads better
    "E741",   # `l` in the sentiment test set
    "B008",   # FastAPI Depends()/Field defaults
    "E731",   # lambdas in tests
    "B905",   # zip(strict=...): the zipped sequences are equal-length by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"api/main.py" = ["E402"]
"frontend/streamlit_app.py" = ["E402"]

[tool.coverage.run]
source = ["agents", "rag", "data", "api", "core", "llm", "pipeline", "config"]
omit = ["*/tests/*"]
